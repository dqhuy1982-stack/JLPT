const escapeAttr=s=>esc(s);

const isoDaysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()};
const uiTime=ts=>ts?new Date(ts).toLocaleString(lang()==='vi'?'vi-VN':'en-GB',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const shuffle=(a)=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const minPass=n=>Math.floor(n*.85)+1;
const PROFILES=DEMO_PROFILES;
function firstDB(){let profiles={};for(const s of PROFILES){const hist=s.historySeed.map((h,i)=>({...h,id:`${s.id}-seed-${i}`,at:isoDaysAgo(h.daysAgo),assisted:0,items:[],demoSeed:true}));profiles[s.id]={id:s.id,name:s.name,jp:s.jp,avatar:s.avatar,target:s.target,context:s.context,goal:s.goal,lang:s.lang,minutes:s.minutes,days:s.days,accuracy:s.accuracy,history:hist,pausedSnapshots:{},review:s.reviewSeed.map((v,i)=>({id:`${s.id}-r-${i}`,text:v[0],note:v[1],kind:v[2],source:'sample',at:isoDaysAgo(i+1)})),snapshot:null,seenTour:false,extraSessions:[0,1,2,3,4,5,6].map((daysAgo,i)=>({at:isoDaysAgo(daysAgo),minutes:Math.round((i+1)*4+(s.id.length%3)*5)}))}}return{version:1,selected:null,view:'profiles',stage:'foundation',language:'vi',profiles,tourStep:0,tour:false,activeResult:null,selectedDay:nowDate(),reviewItem:null}};
let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db?.profiles||db.version!==1)db=firstDB()}catch(e){db=firstDB()}
let toastTimer,clockTimer;let activeTick=performance.now();let showingFeedback=false;
const user=()=>db.profiles[db.selected]||null;
const lang=()=>user()?.lang||db.language||'vi';

const notice=s=>{const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)};
const stageBy=id=>STAGES.find(s=>s.id===id);
const activeKind=u=>u?.snapshot?.kind||(u?.target==='N5'?'minna1':`${u?.target}-demo`);
const kindTitle=kind=>kind==='minna1'?t('minnaTitle'):KANA_SETS[kind]?( {hiragana: 'Hiragana',katakana:'Katakana',voiced:loc({vi:'Âm đục / bán đục',en:'Voiced Kana'}),yoon:loc({vi:'Âm ghép',en:'Contracted Kana'}),small:loc({vi:'Chữ nhỏ',en:'Small Kana'})}[kind]):kind?.startsWith('N')?`${kind.slice(0,2)} · ${t('preview')}`:'—';
const kindStage=kind=>KANA_SETS[kind]?'foundation':kind==='minna1'?'N5':kind?.slice(0,2)||'N5';
const stageLabel=id=>{const s=stageBy(id);return s?loc({vi:s.vi,en:s.en}):id};
const go=(v,stage)=>{if(stage)db.stage=stage;db.view=v;db.activeResult=v==='result'?db.activeResult:null;persist();render();window.scrollTo({top:0,behavior:'instant'})};
const focusStage=id=>{db.stage=id;db.view='journey';persist();render();if(window.innerWidth<850)requestAnimationFrame(()=>document.querySelector('.stagepanel')?.scrollIntoView({behavior:'smooth',block:'start'}))};
const currentMission=u=>u.snapshot?{kind:u.snapshot.kind,title:kindTitle(u.snapshot.kind),sub:`${t('qMark')} ${u.snapshot.index+1}/${u.snapshot.questions.length}`}:u.target==='N5'?{kind:'minna1',title:t('minnaTitle'),sub:t('begin')}:{kind:`${u.target}-demo`,title:`${u.target} · ${t('preview')}`,sub:t('begin')};
const stageVisual=(id,u)=>{const i=STAGES.findIndex(s=>s.id===id),ti=STAGES.findIndex(s=>s.id===u.target);if(id===u.target)return'active';if(id==='foundation'&&['hiragana','katakana','voiced','yoon','small'].every(k=>masteryStatus(u,k)==='mastered'))return'mastered';if(i<ti)return'placed';return'planned'};
const masteryStatus=(u,kind)=>{const attempts=u.history.filter(a=>a.kind===kind&&a.correct/a.total>.85).sort((a,b)=>new Date(a.at)-new Date(b.at));if(kind.endsWith('-demo'))return u.history.some(a=>a.kind===kind)?'needsReview':'notStarted';if(!KANA_SETS[kind])return attempts.length?'mastered':u.history.some(a=>a.kind===kind)?'needsReview':'notStarted';if(attempts.some((a,i)=>attempts.slice(i+1).some(b=>new Date(b.at)-new Date(a.at)>=86400000)))return'mastered';if(attempts.length)return'passOnce';if(u.history.some(a=>a.kind===kind))return'needsReview';return'notStarted'};
const statusPill=st=>st==='mastered'?`<span class="pill good">✓ ${t('verified')}</span>`:st==='passOnce'?`<span class="pill warn">◉ ${t('passedOnce')}</span>`:st==='needsReview'?`<span class="pill warn">↻ ${t('needReview')}</span>`:st==='active'?`<span class="pill warn">◉ ${t('current')}</span>`:st==='placed'?`<span class="pill blue">↝ ${t('placed')}</span>`:st==='planned'?`<span class="pill planned">◇ ${t('planned')}</span>`:`<span class="pill">○ ${t('assigned')}</span>`;
function questionsFor(kind){if(KANA_SETS[kind]){let set=shuffle(KANA_SETS[kind]);const unique=[...new Set(KANA_SETS[kind].map(x=>x[1]))];return set.map(([char,roma],n)=>{let wrong=shuffle(unique.filter(v=>v!==roma)).slice(0,3);return {id:`${kind}-${n}`,prompt:char,romaji:roma,answer:roma,options:shuffle([roma,...wrong]),explain:{vi:`${char} đọc là ${roma}.`,en:`${char} is pronounced ${roma}.`}}})}
if(kind==='minna1'){return shuffle(N5_Q).slice(0,18).map((q,i)=>{let order=shuffle([0,1,2,3]);return{id:`n5-${i}-${N5_Q.indexOf(q)}`,prompt:lang()==='vi'?q[0]:q[1],promptVi:q[0],promptEn:q[1],answer:0,options:order.map(n=>({i:n,vi:q[2][n],en:q[3][n]})),explain:{vi:q[5],en:q[6]},romaji:''}})}
const raw=HIGHER_Q[kind?.slice(0,2)]||HIGHER_Q.N2;return shuffle(raw).map((q,i)=>{let other=shuffle(raw.filter(x=>x!==q)).slice(0,3);let answers=shuffle([{i:0,vi:q[2],en:q[3]},...other.map((r,j)=>({i:j+1,vi:r[2],en:r[3]}))]);return{id:`${kind}-${i}`,prompt:lang()==='vi'?q[0]:q[1],promptVi:q[0],promptEn:q[1],answer:0,options:answers,explain:{vi:q[2],en:q[3]},romaji:''}})}
function normalizeQuestionDisplay(q){if(q.promptVi)q.prompt=lang()==='vi'?q.promptVi:q.promptEn}
function createSnapshot(kind){const qs=questionsFor(kind);const snap={kind,questions:qs,index:0,answers:[],selected:null,hints:0,qSeconds:0,startedAt:new Date().toISOString(),lastSaved:new Date().toISOString(),feedback:false};return snap}
function bootstrapSnapshots(){for(const s of PROFILES){const u=db.profiles[s.id];u.pausedSnapshots=u.pausedSnapshots||{};if(!u.snapshot){const kind=s.id==='dad'?'minna1':`${s.target}-demo`;const snap=createSnapshot(kind);const initial=s.id==='dad'?6:s.id==='learner_n2'?1:s.id==='learner_n3'?2:0;for(let i=0;i<initial;i++){let q=snap.questions[i];snap.answers.push({id:q.id,prompt:q.prompt,correct:i%4!==3,seconds:8+i,answer:'',expected:KANA_SETS[kind]?q.answer:loc(q.options.find(o=>o.i===0)),hints:0});}snap.index=initial;snap.lastSaved=isoDaysAgo(s.id==='dad'?1:2);u.snapshot=snap}}persist()}
bootstrapSnapshots();

function shell(content){const u=user();let nav=navs();return `<div class="shell"><aside class="sidebar"><div class="brand">${logo()}<div><div class="brand-name">Nihongo Path</div><div class="brand-sub">${t('brand')}</div></div></div><nav class="nav">${nav.map(([id,ico,name])=>`<button data-act="navigate" data-value="${id}" class="navbutton ${db.view===id?'active':''}"><span class="navicon">${ico}</span><span>${name}</span></button>`).join('')}<button data-act="tour" class="navbutton"><span class="navicon">✧</span><span>${t('tour')}</span></button></nav><div class="side-profile"><span class="avatar">${esc(u.avatar)}</span><span class="profile-info"><b>${esc(u.name)}</b><br><small>${esc(u.target)} · ${esc(u.jp)}</small><br><span class="pill demo">${t('demo')}</span></span></div></aside><main class="main"><header class="topbar"><div class="brand">${logo()}<div><div class="brand-name">Nihongo Path</div><div class="brand-sub">${t('brand')}</div></div></div><div class="topright"><span class="pill demo onlywide">${t('demo')}</span><button data-act="language" data-value="vi" class="langbtn ${lang()==='vi'?'active':''}">VN</button><button data-act="language" data-value="en" class="langbtn ${lang()==='en'?'active':''}">EN</button><button class="topbtn" data-act="profile" title="${t('switch')}">${esc(u.avatar)} <span class="onlywide">${esc(u.name)}</span></button></div></header>${content}</main><div class="bottombar">${nav.map(([id,ico,name])=>`<button data-act="navigate" data-value="${id}" class="bottombtn ${db.view===id?'active':''}"><b>${ico}</b><span>${name}</span></button>`).join('')}</div></div>`}
function profilesPage(){return`<div class="profile-screen"><div class="profile-brand">${logo()}<div><h1>Nihongo Path</h1><span class="eyebrow">${t('brand')}</span></div></div><div class="profile-intro"><h2>${t('profiles')}</h2><p>${t('profileHint')}</p><div class="row between wrap" style="justify-content:center"><span class="pill demo">◈ ${t('demoStatus')}</span><span class="pill">${t('firstRun')}</span></div><div style="margin:13px"><button data-act="language" data-value="vi" class="langbtn ${lang()==='vi'?'active':''}">VN</button> <button data-act="language" data-value="en" class="langbtn ${lang()==='en'?'active':''}">EN</button></div></div><div class="profile-tiles">${PROFILES.map(s=>{let u=db.profiles[s.id],m=currentMission(u);return`<button class="profile-tile" data-act="choose" data-value="${s.id}"><span class="avatar">${esc(u.avatar)}</span><b>${esc(u.name)}</b><small>${esc(u.jp)} · ${u.target}</small><span class="pill">${u.snapshot?`${t('pending')} ${u.snapshot.index+1}/${u.snapshot.questions.length}`:t('ready')}</span></button>`}).join('')}</div><p class="demoinfo">${t('demoWarning')}<br>${t('localNote')}</p><div class="row wrap" style="justify-content:center"><button class="btn outline small" data-act="reset">↻ ${t('clearDemo')}</button></div></div>`}
function resumeCard(u){const m=currentMission(u);const snap=u.snapshot;return `<div class="panel hero"><div class="eyebrow">${snap?t('resume'):t('continue')}</div><h2 class="hero-title">${esc(m.title)}</h2><div class="row between wrap"><span class="muted">${esc(m.sub)}</span>${snap?`<span class="pill warn">${t('pending')}</span>`:''}</div><div class="progress" style="margin:12px 0"><span style="width:${snap?pct(snap.index,snap.questions.length):0}%"></span></div><div class="row between wrap"><small>${snap?`${snap.index}/${snap.questions.length} · ${t('last')}: ${uiTime(snap.lastSaved)}`:t('begin')}</small><button data-act="resume" class="btn">▶ ${snap?t('continue'):t('start')}</button></div><div class="minihr"></div><span class="sm">${t('youAreHere')}: <b>${stageLabel(kindStage(m.kind))}</b></span></div>`}
function tasks(u){const snap=u.snapshot;const data=[{title:t('task1'),desc:snap?`${kindTitle(snap.kind)} · ${snap.index+1}/${snap.questions.length}`:t('begin'),act:'resume',icon:'▶'}, {title:t('task2'),desc:`${u.review.length} ${t('review')}`,act:'notebook',icon:'↻'}, {title:t('task3'),desc:stageLabel(u.target),act:'journey',icon:'⌁'}];return`<div class="panel"><div class="row between"><h3 class="sectiontitle">${t('next')}</h3><span class="pill">${t('today')}</span></div><div class="dailylist">${data.map((x,i)=>`<div class="task"><span class="num">${i+1}</span><div class="grow"><div class="title">${x.title}</div><div class="desc">${esc(x.desc)}</div></div><button class="btn alt small" data-act="${x.act==='notebook'?'navigate':x.act==='journey'?'selectTarget':'resume'}" data-value="${x.act==='notebook'?'notebook':x.act==='journey'?u.target:''}">${t('open')} →</button></div>`).join('')}</div></div>`}
function statsPanel(u){return`<div class="kpis"><button class="kpi t-right" data-act="navigate" data-value="insights"><div class="kpi-value">${u.minutes}</div><div class="kpi-label">${t('studyTime')}</div></button><button class="kpi t-right" data-act="navigate" data-value="insights"><div class="kpi-value">${u.days}</div><div class="kpi-label">${t('learningDays')}</div></button><button class="kpi t-right" data-act="navigate" data-value="insights"><div class="kpi-value">${u.accuracy}%</div><div class="kpi-label">${t('accuracy')}</div></button><button class="kpi t-right" data-act="navigate" data-value="insights"><div class="kpi-value">${u.history.length}</div><div class="kpi-label">${t('tests')}</div></button></div>`}
function homePage(){const u=user();const inProgress=u.snapshot&&kindStage(u.snapshot.kind)===u.target;const unitPct=inProgress?pct(u.snapshot.index,u.snapshot.questions.length):0;return`<div class="pagehead"><div class="eyebrow">${t('today')} · ${new Date().toLocaleDateString(lang()==='vi'?'vi-VN':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>${t('welcome')}, ${esc(u.name)} 👋</h1><p>${t('basedOn')} <span class="pill blue">${u.target}</span> <span class="pill demo">${t('demo')}</span></p></div><div class="stack">${statsPanel(u)}<div class="grid2"><div class="stack">${resumeCard(u)}${tasks(u)}</div><div class="stack"><div class="panel"><div class="row between"><h3 class="sectiontitle">${t('path')}</h3><span class="pill">${u.target}</span></div><div class="row between" style="margin-bottom:12px"><span class="avatar big">${esc(u.avatar)}</span><div class="grow"><div class="eyebrow">${t('youAreHere')}</div><h2 style="margin:4px 0">${stageLabel(u.target)}</h2><small>${loc(STAGE_GOALS[u.target])}</small></div></div><div class="progress" title="${inProgress?`${u.snapshot.index}/${u.snapshot.questions.length}`:t('noMastery')}"><span style="width:${unitPct}%"></span></div><div class="sm muted" style="margin-top:6px">${inProgress?`${t('activity')}: ${u.snapshot.index}/${u.snapshot.questions.length}`:t('noMastery')}</div><div class="minihr"></div><button class="btn block alt" data-act="selectTarget" data-value="${u.target}">⌁ ${t('openMap')} →</button><p class="sm muted" style="margin-top:9px">${t('notMastered')}</p></div><div class="panel soft"><div class="row between"><h3 class="sectiontitle">${t('quote')}</h3><span class="pill">日本語</span></div><div style="font-size:22px;font-weight:700;color:var(--gold2)">継続は力なり。</div><div class="sm">Keizoku wa chikara nari.</div><p>${lang()==='vi'?'Kiên trì tạo nên sức mạnh.':'Consistency is strength.'}</p><button class="btn outline small" data-act="saveQuote">＋ ${t('saveReview')}</button></div></div></div><div class="panel soft"><div class="row between wrap"><div><h3 class="sectiontitle">${t('onboarding')}</h3><p class="sm muted">${t('tour1p')}</p></div><button class="btn outline small" data-act="tour">✦ ${t('tour')}</button></div></div></div>`}

S428 593 345 541 S65 504 142 461 S405 407 326 366 S68 314 143 275 S354 230 266 189 S288 132 316 116" fill="none" stroke="url(#pathGold)" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 14"/><g opacity=".7"><path d="M28 558l9 -35l9 35M23 565h28M44 595l9 -33l10 33M39 600h29M417 512l9 -35l10 35M410 520h32" fill="none" stroke="#99b9b2" stroke-width="5" stroke-linecap="round"/><circle cx="76" cy="599" r="8" fill="#cc98ba"/><circle cx="392" cy="474" r="7" fill="#eaa2b3"/><circle cx="67" cy="371" r="9" fill="#d3a3ca"/><circle cx="420" cy="345" r="6" fill="#d3a3ca"/></g><g stroke="#c58466" stroke-width="7"><path d="M55 704V679M107 704V679M47 677H117M52 666H110"/><path d="M321 158V135M351 158V135M313 134H359M319 124H352"/></g></svg>`}
function mapCard(u){const active=STAGES.find(x=>x.id===u.target);let points=STAGES.map(s=>{let stat=stageVisual(s.id,u);return`<button class="checkpoint ${stat} ${db.stage===s.id?'selected':''}" data-act="stage" data-value="${s.id}" style="left:${s.pos[0]}%;top:${s.pos[1]}%" aria-label="${esc(stageLabel(s.id))}, ${esc(stat)}"><span class="orb">${s.label==='Kana'?'あ':s.label}</span><span class="cpname">${stat==='active'?'◉':stat==='mastered'?'✓':stat==='placed'?'↝':'◇'} ${esc(s.label)}</span></button>`}).join('');return`<div class="journey-map">${mountainSVG()}${points}<span class="traveler" style="left:${active.pos[0]-9}%;top:${active.pos[1]-5}%" aria-hidden="true">🚶</span><span class="mapcaption">${t('youAreHere')}: ${esc(stageLabel(u.target))}</span></div>`}
function stepRow(kind,stat){const kana=KANA_SETS[kind],u=user(),a=u.history.filter(h=>h.kind===kind),title=kindTitle(kind),snap=u.snapshot?.kind===kind?u.snapshot:null;return`<div class="step"><div class="step-symbol">${stat==='mastered'?'✓':stat==='passOnce'?'◉':stat==='planned'?'◇':snap?'▶':'○'}</div><div class="grow"><div class="step-title">${esc(title)}</div><div class="step-sub">${kana?`${kana.length} ${t('qMark').toLowerCase()} · ${t('threshold')}`:kind==='minna1'?`18 ${t('qMark').toLowerCase()} · ${t('minnaTitle')}`:`5 ${t('qMark').toLowerCase()} · ${t('preview')}`}</div><div class="steppills">${statusPill(snap?'active':stat)} ${a.length?`<span class="pill">${a.length} ${t('tests').toLowerCase()}</span>`:''}</div></div><button class="btn small ${stat==='planned'?'outline':''}" data-act="openKind" data-value="${kind}" ${stat==='planned'?'disabled':''}>${snap?t('continue'):a.length?t('replay'):t('open')} →</button></div>`}
function stageDetail(u){const s=stageBy(db.stage)||STAGES[0],stat=stageVisual(s.id,u),history=u.history.filter(a=>kindStage(a.kind)===s.id),hours=s.baseHours?`${s.baseHours} ${t('hours')}`:t('estimateCustom');let steps='';if(s.id==='foundation')steps=['hiragana','katakana','voiced','yoon','small'].map(k=>stepRow(k,masteryStatus(u,k))).join('');else if(s.id==='N5')steps=stepRow('minna1',u.snapshot?.kind==='minna1'?'active':masteryStatus(u,'minna1'))+`<div class="step"><div class="step-symbol">◇</div><div class="grow"><div class="step-title">${lang()==='vi'?'Minna · Bài 2–25':'Minna · Lessons 2–25'}</div><div class="step-sub">${t('planned')}</div></div>${statusPill('planned')}</div>`;else if(['N4','N3','N2'].includes(s.id))steps=stepRow(`${s.id}-demo`,u.snapshot?.kind===`${s.id}-demo`?'active':u.history.some(h=>h.kind===`${s.id}-demo`)?'needsReview':'notStarted')+`<div class="step"><div class="step-symbol">◇</div><div class="grow"><div class="step-title">${lang()==='vi'?'Khóa chính thức · Sắp phát triển':'Full course · Planned'}</div><div class="step-sub">${t('planned')}</div></div>${statusPill('planned')}</div>`;else steps=`<div class="notebox">${t('planned')}. ${t('demoUnlock')}</div>`;
return`<section class="panel stagepanel" id="stagepanel"><div class="stageheader"><div class="stageicon">${s.icon}</div><div class="grow"><div class="eyebrow">${t('stepDetails')}</div><h2 style="margin:3px 0">${esc(stageLabel(s.id))}</h2>${statusPill(stat)}</div></div><p style="margin-top:14px;color:var(--soft)">${loc(STAGE_GOALS[s.id])}</p><div class="mstats"><div class="statitem"><b>${s.total||'—'}</b><small>${s.total?(s.id==='foundation'?(lang()==='vi'?'Nhóm Kana':'Kana groups'):(lang()==='vi'?'Bài trong giáo trình':'Textbook lessons')):t('planned')}</small></div><div class="statitem"><b>${s.baseHours||'—'}</b><small>${s.baseHours?t('hours'):t('notApplicable')}</small></div><div class="statitem"><b>${history.length}</b><small>${t('tests')}</small></div></div><p class="sm muted" style="margin:11px 0">${s.baseHours?t('courseHours'):t('estimateCustom')}</p>${stat==='placed'?`<div class="evidence">↝ <b>${t('placed')}</b> · ${t('notMastered')}</div>`:''}<div class="minihr"></div><h3 class="sectiontitle">${t('activity')} · ${t('nextStep')}</h3><div class="stage-timeline">${steps}</div><div class="minihr"></div><h3 class="sectiontitle">${t('attempts')}</h3>${history.length?history.slice().reverse().map(a=>attemptRow(a)).join(''):`<p class="muted sm">${t('noHistory')}</p>`}<div class="evidence">✦ ${t('scoreRules')}</div></section>`}
function attemptRow(a){return`<div class="attemptrow"><div><b class="sm">${esc(kindTitle(a.kind))}</b><div class="sm muted">${uiTime(a.at)} · ${Math.round(a.seconds/a.total*10)/10}s/${t('qMark').toLowerCase()}</div></div><span class="pill ${pct(a.correct,a.total)>85?'good':'warn'}">${a.correct}/${a.total} · ${pct(a.correct,a.total)}%</span></div>`}
function journeyPage(){const u=user();return `<div class="pagehead"><div class="eyebrow">FUJI · INTERACTIVE JOURNEY</div><h1>${t('path')}</h1><p>${t('scoreRules')} <span class="pill demo">${t('demo')}</span></p><div class="row wrap"><span class="pill blue">${t('selected')}: ${u.target}</span><button class="btn outline small" data-act="tour">✦ ${t('tour')}</button></div><div class="journey-selector" style="margin-top:10px"><span class="sm muted">${t('changeStage')}:</span>${['N5','N4','N3','N2','N1'].map(level=>`<button class="btn ${u.target===level?'':'outline'} small" data-act="setTarget" data-value="${level}">${level}</button>`).join('')}</div></div><div class="journeygrid">${mapCard(u)}${stageDetail(u)}</div><p class="sm muted" style="margin-top:13px">${t('demoUnlock')}</p>`}
function lessonPage(){const u=user();let snap=u.snapshot;if(!snap){return`<div class="panel"><h2>${t('noPause')}</h2><button class="btn" data-act="openKind" data-value="${u.target==='N5'?'minna1':`${u.target}-demo`}">${t('start')}</button></div>`}const kind=snap.kind,stage=kindStage(kind),c=snap.questions[snap.index];if(!c){return`<div class="panel">${t('result')}</div>`}normalizeQuestionDisplay(c);const answered=snap.feedback;let prev=snap.answers[snap.answers.length-1];const kana=!!KANA_SETS[kind];let answers=kana?c.options.map((o,i)=>`<button class="choice ${snap.selected===o?'selected':''} ${answered&&o===c.answer?'correct':''} ${answered&&o===snap.selected&&o!==c.answer?'incorrect':''}" data-act="pick" data-value="${encodeURIComponent(o)}" ${answered?'disabled':''}>${esc(o)}</button>`).join(''):c.options.map((o,i)=>`<button class="choice ${snap.selected===o.i?'selected':''} ${answered&&o.i===0?'correct':''} ${answered&&o.i===snap.selected&&o.i!==0?'incorrect':''}" data-act="pick" data-value="${o.i}" ${answered?'disabled':''}>${esc(loc(o))}</button>`).join('');const correct=kana?snap.selected===c.answer:snap.selected===0;
return`<div class="breadcrumbs">${esc(u.name)} <span>›</span> ${esc(stage)} <span>›</span> ${esc(kindTitle(kind))} <span>›</span> <strong>${t('qMark')} ${snap.index+1}/${snap.questions.length}</strong></div><div class="pagehead row between wrap"><div><div class="eyebrow">${kana?t('kana'):t('minnaTitle')} · ${t('lessonNotice')}</div><h1>${esc(kindTitle(kind))}</h1></div><button class="btn outline small" data-act="pause">▣ ${t('paused')}</button></div><div class="grid2"><div class="panel"><div class="row between"><span class="pill">${t('qMark')} ${snap.index+1}/${snap.questions.length}</span><span class="pill">⏱ <span id="qTimer">${Math.round(snap.qSeconds)}s</span></span></div><div class="progress" style="margin:12px 0"><span style="width:${pct(snap.index,snap.questions.length)}%"></span></div><div class="lesson-question">${esc(c.prompt)}</div><div class="choicegrid">${answers}</div>${snap.hints>0&&!answered?`<div class="questionhint">💡 ${snap.hints===1?(kana?(lang()==='vi'?'Hãy nhớ nhóm hàng chữ và âm đầu.':'Recall the kana row and initial sound.'):(lang()==='vi'?'Tìm từ khóa trong câu hỏi.':'Look for the keyword in the sentence.')):snap.hints===2?(kana?`${lang()==='vi'?'Âm bắt đầu bằng':'Sound starts with'}: ${esc(c.answer.charAt(0))}…`:loc(c.explain)):`${lang()==='vi'?'Đáp án là':'Answer is'}: ${esc(kana?c.answer:loc(c.options.find(o=>o.i===0)))}`}</div>`:''}${answered?`<div class="feedback ${correct?'':'bad'}"><b>${correct?`✓ ${t('correct')}`:`✕ ${t('wrong')}`}</b><p class="sm">${t('answer')}: <b>${esc(kana?c.answer:loc(c.options.find(o=>o.i===0)))}</b></p><div class="sm">${loc(c.explain)}</div></div>`:''}<div class="row wrap" style="margin-top:15px"><button class="btn outline small" data-act="saveCurrent">＋ ${t('saveReview')}</button>${!answered?`<button class="btn ghost small" data-act="hint">💡 ${t('hint')} ${snap.hints}/3</button><button class="btn" data-act="submit" ${snap.selected===null?'disabled':''}>${t('check')} →</button>`:`<button class="btn" data-act="nextQuestion">${snap.index===snap.questions.length-1?t('finish'):t('nextQ')} →</button>`}</div><p class="muted sm" style="margin-top:13px">${t('clockNote')}</p></div><div class="stack"><div class="panel"><h3>${t('youAreHere')}</h3><p>${esc(u.name)} → ${esc(stageLabel(stage))} → ${esc(kindTitle(kind))}</p><div class="mstats"><div class="statitem"><b>${snap.index+1}</b><small>${t('current')}</small></div><div class="statitem"><b>${snap.questions.length}</b><small>${t('qMark')}</small></div><div class="statitem"><b>${snap.answers.filter(x=>x.correct&&!x.hints).length}</b><small>${t('correct')}</small></div></div><div class="minihr"></div><button class="btn alt block small" data-act="stage" data-value="${stage}">${t('seeFull')} · ${stage} →</button></div><div class="panel soft"><h3>${t('nextStep')}</h3><p class="sm muted">${t('wrongNote')}</p><button class="btn outline block small" data-act="navigate" data-value="notebook">${t('toNotebook')} →</button></div></div></div>`}
function resultPage(){const r=db.activeResult,u=user();if(!r)return`<div class="panel"><h2>${t('noHistory')}</h2></div>`;const pass=r.correct/r.total>.85,kind=r.kind,hasMore=KANA_SETS[kind];let state=masteryStatus(u,kind);let nextKind=hasMore?['hiragana','katakana','voiced','yoon','small'][(['hiragana','katakana','voiced','yoon','small'].indexOf(kind)+1)%5]:kind==='minna1'?'minna1':kind;return`<div class="pagehead"><div class="eyebrow">${t('result')} · ${t('demo')}</div><h1>${pass?'🎉':'🌱'} ${pass?t('ready'):t('needs')}</h1><p>${kindTitle(kind)} · ${t('tests')} #${u.history.filter(a=>a.kind===kind).length}</p></div><div class="stack"><div class="panel"><div class="mstats"><div class="statitem"><b>${r.correct}/${r.total}</b><small>${t('correct')}</small></div><div class="statitem"><b>${pct(r.correct,r.total)}%</b><small>${t('score')}</small></div><div class="statitem"><b>${Math.round(r.seconds/r.total*10)/10}s</b><small>${lang()==='vi'?'TB/câu':'Avg/item'}</small></div></div><div class="minihr"></div><div class="row between wrap">${statusPill(state)}<span class="pill">${Math.round(r.seconds)}s · ${uiTime(r.at)}</span></div><div class="evidence">${pass&&hasMore&&state!=='mastered'?(lang()==='vi'?'Đạt lượt này. Cần lượt đạt thứ hai cách ≥24 giờ để xác nhận nhớ vững.':'This attempt passed. A second pass ≥24 hours later is needed for confirmed mastery.'):t('scoreRules')}</div>${r.items.filter(x=>!x.correct).length?`<h3>${t('seeMistakes')}</h3>${r.items.filter(x=>!x.correct).slice(0,12).map(x=>`<div class="attemptrow"><div><b>${esc(x.prompt)}</b><div class="sm muted">${t('answer')}: ${esc(x.expected)}</div></div><span class="pill warn">${Math.round(x.seconds)}s</span></div>`).join('')}`:`<p class="sm muted">${lang()==='vi'?'Không có câu sai trong lượt này.':'No incorrect items in this attempt.'}</p>`}</div><div class="panel"><h3>${t('nextStep')}</h3><p class="muted sm">${pass?loc({vi:'Bạn có thể thử nhóm kế tiếp ngay. Kiểm tra lại sau 24 giờ để củng cố.',en:'You can try the next group now. Retest after 24 hours to strengthen recall.'}):loc({vi:'Ôn câu sai và làm một lượt khác với thứ tự câu đã xáo trộn.',en:'Review mistakes and retry with reshuffled questions.'})}</p><div class="row wrap"><button data-act="openKind" data-value="${pass?nextKind:kind}" class="btn">${pass?t('continueNext'):t('runAgain')} →</button><button data-act="navigate" data-value="notebook" class="btn alt">${t('toNotebook')}</button><button data-act="selectTarget" data-value="${kindStage(kind)}" class="btn outline">${t('openMap')}</button></div></div></div>`}
function reviewDetailPage(){const u=user(),r=u.review.find(x=>x.id===db.reviewItem);if(!r)return`<div class="panel"><h2>${t('nothing')}</h2><button class="btn" data-act="navigate" data-value="notebook">${t('toNotebook')}</button></div>`;return`<div class="pagehead"><button class="btn outline small" data-act="navigate" data-value="notebook">← ${t('back')}</button><div class="eyebrow" style="margin-top:16px">${t('reviewed')} · ${esc(kindTitle(r.kind))}</div><h1>${esc(r.text)}</h1></div><div class="panel"><span class="pill warn">↻ ${t('needReview')}</span><div class="minihr"></div><h3>${t('response')}</h3><p>${esc(r.note)}</p><div class="sm muted">${t('date')}: ${uiTime(r.at)} · ${r.source==='sample'?t('demo'):t('study')}</div><div class="row wrap" style="margin-top:18px"><button class="btn" data-act="openKind" data-value="${esc(r.kind)}">▶ ${t('replay')}</button><button class="btn alt" data-act="navigate" data-value="notebook">${t('toNotebook')}</button></div></div>`}
function notebookPage(){const u=user(),s=u.snapshot;return`<div class="pagehead"><div class="eyebrow">STUDY PASSPORT</div><h1>${t('notebook')}</h1><p>${t('notebookTabs')}</p></div><div class="grid2"><div class="stack"><div class="panel"><h3>${t('pending')}</h3>${s?`<div class="row between wrap"><div><b>${esc(kindTitle(s.kind))}</b><div class="sm muted">${t('qMark')} ${s.index+1}/${s.questions.length} · ${uiTime(s.lastSaved)}</div></div><button data-act="resume" class="btn small">▶ ${t('continue')}</button></div>`:''}${Object.values(u.pausedSnapshots||{}).map(s=>`<div class="row between wrap" style="margin:9px 0"><div><b>${esc(kindTitle(s.kind))}</b><div class="sm muted">${t('qMark')} ${s.index+1}/${s.questions.length} · ${uiTime(s.lastSaved)}</div></div><button data-act="openKind" data-value="${s.kind}" class="btn alt small">▶ ${t('continue')}</button></div>`).join('')}${!s&&!Object.keys(u.pausedSnapshots||{}).length?`<p class="muted">${t('noPause')}</p>`:''}</div><div class="panel"><div class="row between"><h3 class="sectiontitle">${t('reviewed')} (${u.review.length})</h3><span class="pill">${t('review')}</span></div>${u.review.length?u.review.map(r=>`<div class="reviewrow"><div><b>${esc(r.text)}</b><div class="sm muted">${esc(r.note)} · ${uiTime(r.at)}</div></div><button data-act="showReview" data-value="${escapeAttr(r.id)}" class="btn alt small">${t('open')} →</button></div>`).join(''):`<p class="muted">${t('nothing')}</p>`}</div></div><div class="panel"><h3>${t('attempts')}</h3>${u.history.length?u.history.slice().reverse().map(a=>attemptRow(a)).join(''):`<p>${t('noHistory')}</p>`}<div class="minihr"></div><p class="sm muted">${t('localNote')}</p></div></div>`}
function insightsPage(){const u=user(),sessions=u.extraSessions||[],times=[...sessions].reverse();const max=Math.max(1,...times.map(x=>x.minutes));let days=new Date(),y=days.getFullYear(),mo=days.getMonth(),first=new Date(y,mo,1).getDay();let offset=(first+6)%7,monthLen=new Date(y,mo+1,0).getDate();let cal=`<div class="calendar">${(lang()==='vi'?['T2','T3','T4','T5','T6','T7','CN']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(x=>`<span class="weekday">${x}</span>`).join('')}${Array.from({length:offset},()=>'<span style="opacity:0"></span>').join('')}${Array.from({length:monthLen},(_,i)=>{const date=new Date(y,mo,i+1).toLocaleDateString('sv-SE');const logged=sessions.some(s=>new Date(s.at).toLocaleDateString('sv-SE')===date);return`<button data-act="calendarDay" data-value="${date}" class="${logged?'studyday':''} ${date===nowDate()?'today':''} ${db.selectedDay===date?'selected':''}" aria-label="${date}">${i+1}</button>`}).join('')}</div>`;return`<div class="pagehead"><div class="eyebrow">LEARNING ANALYTICS</div><h1>${t('insights')}</h1><p>${t('demoWarning')}</p></div><div class="stack">${statsPanel(u)}<div class="grid2"><div class="panel"><h3>${t('week')} · ${t('studyTime')}</h3><div class="chart">${times.map(x=>`<div class="chartcol"><div class="chartbar" style="height:${Math.max(3,Math.round(x.minutes/max*92))}%" title="${x.minutes} ${t('minutes')}"></div><div class="chartlabel">${new Date(x.at).toLocaleDateString(lang()==='vi'?'vi-VN':'en-GB',{weekday:'short'})}</div></div>`).join('')}</div><div class="minihr"></div>${times.map(s=>`<div class="attemptrow"><span>${new Date(s.at).toLocaleDateString(lang()==='vi'?'vi-VN':'en-GB')}</span><b>${s.minutes} ${t('minutes')}</b></div>`).join('')}</div><div class="panel"><div class="row between"><h3>${t('date')}</h3><span class="pill">${new Date().toLocaleDateString(lang()==='vi'?'vi-VN':'en-GB',{month:'long',year:'numeric'})}</span></div>${cal}<div class="minihr"></div><div class="notebox">${db.selectedDay}: ${sessions.filter(s=>new Date(s.at).toLocaleDateString('sv-SE')===db.selectedDay).reduce((n,s)=>n+s.minutes,0)} ${t('minutes')} · ${t('sessions')}: ${sessions.filter(s=>new Date(s.at).toLocaleDateString('sv-SE')===db.selectedDay).length}</div></div></div><div class="panel"><h3>${t('attempts')}</h3>${u.history.slice().reverse().map(a=>attemptRow(a)).join('')}<p class="sm muted">${t('demoWarning')}</p></div></div>`}
function tourPage(){const u=user();const arr=[['tour1','tour1p'],['tour2','tour2p'],['tour3','tour3p'],['tour4','tour4p']];let step=clamp(db.tourStep,0,3);return`<div class="tour-backdrop"><div class="tour" role="dialog" aria-modal="true" aria-label="${t('onboarding')}"><div class="eyebrow">${t('onboarding')} · ${step+1}/4 · ${esc(u.name)}</div><div class="tour-flex"><div><h2>${t(arr[step][0])}</h2><p style="color:#d1def3">${t(arr[step][1])}</p><div class="dots" style="margin:18px 0">${arr.map((_,i)=>`<span class="dot ${i===step?'on':''}"></span>`).join('')}</div><div class="row wrap"><button class="btn" data-act="tourNext">${step===3?t('tourDone'):t('tourNext')} →</button><button class="btn outline" data-act="tourClose">${t('tourExit')}</button></div></div><div class="tour-scene"><div class="tour-mountain">${['🌱','⛩️','🧭','🗻'][step]}</div><div class="tour-path">${['👣','🚶','📘','🏆'][step]}</div></div></div></div></div>`}
function render(){const view=db.view;let content= view==='profiles'?profilesPage():view==='home'?homePage():view==='journey'?journeyPage():view==='learn'?lessonPage():view==='result'?resultPage():view==='notebook'?notebookPage():view==='reviewItem'?reviewDetailPage():view==='insights'?insightsPage():homePage();$('app').innerHTML=view==='profiles'?content:shell(content);$('tourOverlay').innerHTML=db.tour&&user()?tourPage():'';document.documentElement.lang=lang();activeTick=performance.now()}
function choose(id){if(!db.profiles[id])return;db.selected=id;db.stage=db.profiles[id].target;db.view='home';db.activeResult=null;db.tour=!db.profiles[id].seenTour;db.tourStep=0;persist();render();window.scrollTo(0,0)}
function leaveProfile(){if(db.view==='learn'&&user()?.snapshot&&!confirm(lang()==='vi'?'Bài đang làm sẽ được tự lưu. Chuyển hồ sơ?':'The current activity is saved automatically. Switch learner?'))return;db.selected=null;db.view='profiles';db.tour=false;db.activeResult=null;persist();render()}
function startKind(kind){const u=user();if(!u)return;if(!KANA_SETS[kind]&&kind!=='minna1'&&!HIGHER_Q[kind?.slice(0,2)])return;
  u.pausedSnapshots=u.pausedSnapshots||{};
  if(u.snapshot&&u.snapshot.kind===kind){resume();return;}
  if(u.snapshot&&u.snapshot.kind!==kind){u.pausedSnapshots[u.snapshot.kind]=u.snapshot;}
  if(u.pausedSnapshots[kind]){u.snapshot=u.pausedSnapshots[kind];delete u.pausedSnapshots[kind];}
  else u.snapshot=createSnapshot(kind);
  db.activeResult=null;db.view='learn';persist();render();window.scrollTo(0,0)
}
function resume(){const u=user();if(u.snapshot){db.view='learn';persist();render();window.scrollTo(0,0)}else{const pending=Object.values(u.pausedSnapshots||{}).sort((a,b)=>new Date(b.lastSaved)-new Date(a.lastSaved))[0];if(pending)startKind(pending.kind);else startKind(u.target==='N5'?'minna1':`${u.target}-demo`)}}
function pick(value){const s=user()?.snapshot;if(!s||s.feedback)return;s.selected=KANA_SETS[s.kind]?decodeURIComponent(value):Number(value);persist();render()}
function addReview(text,note,kind){const u=user();let id=`${Date.now()}-${Math.random().toString(36).slice(2,6)}`;u.review.unshift({id,text,note,kind,at:new Date().toISOString()});persist();notice(t('saved'))}
function submit(){const u=user(),s=u?.snapshot;if(!s||s.selected===null||s.feedback)return;const q=s.questions[s.index];const kana=!!KANA_SETS[s.kind];const correct=kana?s.selected===q.answer:s.selected===0;const expected=kana?q.answer:loc(q.options.find(o=>o.i===0));const spent=Math.max(.5,Math.round(s.qSeconds*10)/10);s.answers.push({id:q.id,prompt:q.prompt,correct,seconds:spent,answer:String(kana?s.selected:loc(q.options.find(o=>o.i===s.selected))),expected,hints:s.hints});s.feedback=true;s.lastSaved=new Date().toISOString();if(!correct)addReview(q.prompt,`${t('answer')}: ${expected}`,s.kind);persist();render()}
function nextQuestion(){const s=user()?.snapshot;if(!s||!s.feedback)return;if(s.index>=s.questions.length-1){finishAttempt();return}s.index++;s.selected=null;s.hints=0;s.qSeconds=0;s.feedback=false;s.lastSaved=new Date().toISOString();persist();render()}
function finishAttempt(){const u=user(),s=u?.snapshot;if(!s)return;const r={id:`${u.id}-${Date.now()}`,kind:s.kind,at:new Date().toISOString(),correct:s.answers.filter(a=>a.correct&&!a.hints).length,total:s.questions.length,seconds:s.answers.reduce((n,a)=>n+a.seconds,0),assisted:s.answers.filter(a=>a.hints>0).length,items:s.answers};u.history.push(r);u.minutes+=Math.ceil(r.seconds/60);u.days=Math.max(u.days,u.extraSessions.length+1);u.accuracy=pct(u.history.reduce((n,a)=>n+a.correct,0),u.history.reduce((n,a)=>n+a.total,0));u.extraSessions.push({at:r.at,minutes:Math.max(1,Math.ceil(r.seconds/60))});u.snapshot=null;db.activeResult=r;db.view='result';persist();render();window.scrollTo(0,0)}
function act(a,val){const u=user();switch(a){case 'choose':choose(val);return;case 'profile':leaveProfile();return;case 'language':if(u)u.lang=val;else db.language=val;persist();render();return;case 'navigate':if(val==='learn')resume();else go(val);return;case 'selectTarget':focusStage(val);return;case 'setTarget':if(u){u.target=val;db.stage=val;persist();render();notice(`${t('selected')}: ${val}`)}return;case 'stage':focusStage(val);return;case 'resume':resume();return;case 'openKind':if(u?.snapshot?.kind===val)resume();else startKind(val);return;case 'pick':pick(val);return;case 'submit':submit();return;case 'nextQuestion':nextQuestion();return;case 'hint':if(u?.snapshot&&!u.snapshot.feedback){u.snapshot.hints=Math.min(3,u.snapshot.hints+1);persist();render()}return;case 'pause':if(u?.snapshot){u.snapshot.lastSaved=new Date().toISOString();persist();notice(lang()==='vi'?'Đã lưu bài dở trong Sổ học.':'Paused activity saved in Notebook.');go('notebook')}return;case 'saveCurrent':if(u?.snapshot){const q=u.snapshot.questions[u.snapshot.index];addReview(q.prompt,kindTitle(u.snapshot.kind),u.snapshot.kind)}return;case 'saveQuote':addReview('継続は力なり。','Keizoku wa chikara nari.','minna1');return;case 'tour':db.tour=true;db.tourStep=0;persist();render();return;case 'tourNext':if(db.tourStep<3)db.tourStep++;else{db.tour=false;u.seenTour=true}persist();render();return;case 'tourClose':db.tour=false;if(u)u.seenTour=true;persist();render();return;case 'reset':if(confirm(t('confirmReset'))){localStorage.removeItem(KEY);db=firstDB();bootstrapSnapshots();render();notice('Demo reset')}return;case 'showReview':db.reviewItem=val;go('reviewItem');return;case 'calendarDay':db.selectedDay=val;persist();render();return;default:console.warn('unknown action',a,val)}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;act(btn.dataset.act,btn.dataset.value||'')});
document.addEventListener('visibilitychange',()=>{activeTick=performance.now();if(document.hidden)persist()});
clockTimer=setInterval(()=>{const s=user()?.snapshot;const now=performance.now();const dt=Math.max(0,Math.min(1.4,(now-activeTick)/1000));activeTick=now;if(s&&db.view==='learn'&&!document.hidden&&!s.feedback){s.qSeconds+=dt;const el=$('qTimer');if(el)el.textContent=Math.round(s.qSeconds)+'s';if(Math.round(s.qSeconds)%5===0)persist()}},1000);
render();

</script>
</body></html>
