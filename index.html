const weaknesses=[['kana',L('Kana / âm ghép','Kana / combined sounds')],['vocab',L('Từ vựng','Vocabulary')],['grammar',L('Ngữ pháp','Grammar')],['listening',L('Nghe hiểu','Listening')],['speaking',L('Nói / phát âm','Speaking / pronunciation')],['reading',L('Đọc hiểu','Reading')],['kanji',L('Kanji','Kanji')],['writing',L('Viết','Writing')]];pane.innerHTML=`<div class="card"><div class="fields2"><div class="field"><label>${L('Cấp độ muốn bắt đầu','Starting level')}</label><select id="goalLevel" onchange="draft.goal=this.value">${['Foundation','N5','N4','N3','N2','N1'].map(l=>`<option value="${l}" ${draft.goal===l?'selected':''}>${l==='Foundation'?L('Nền tảng Kana','Kana foundations'):l}</option>`).join('')}</select></div><div class="field"><label>${L('Mục tiêu phút/buổi','Target minutes/session')}</label><select onchange="draft.minutes=Number(this.value)">${[5,15,30,45,60,90].map(n=>`<option value="${n}" ${Number(draft.minutes)===n?'selected':''}>${n} ${L('phút','min')}</option>`).join('')}</select></div></div><div class="field"><label>${L('Số ngày học mỗi tuần','Study days per week')}</label><div class="segments">${[3,5,7].map(n=>`<button class="${Number(draft.days)===n?'selected':''}" onclick="draft.days=${n};renderSetup()">${n} ${L('ngày','days')}</button>`).join('')}</div></div><div class="field"><label>${L('Bạn cảm thấy mình cần cải thiện phần nào?','Which skills feel weaker?')}</label><div class="checkgrid">${weaknesses.map(([k,label])=>`<label class="checktile"><input type="checkbox" value="${k}" ${draft.weak.includes(k)?'checked':''} onchange="toggleWeak(this.value,this.checked)">${label}</label>`).join('')}</div></div></div>`}
function renderBackgroundDetail(){if(draft.experience==='new')return `<p class="subdued">${L('Bạn có thể chọn Nền tảng Kana để làm đánh giá khởi đầu.','You can begin with a Kana foundation assessment.')}</p>`;return `<div class="fields2"><div class="field"><label>${L('Cấp độ cao nhất từng học','Highest level studied')}</label><select onchange="draft.previous=this.value">${['none','N5','N4','N3','N2','N1'].map(v=>`<option ${draft.previous===v?'selected':''} value="${v}">${v==='none'?L('Chưa xác định','Not sure'):v}</option>`).join('')}</select></div><div class="field"><label>${L('Thời gian/kinh nghiệm','Experience')}</label><select onchange="draft.experienceYears=this.value">${[['less1',L('Dưới 1 năm','Under 1 year')],['1to2',L('1–2 năm','1–2 years')],['more2',L('Trên 2 năm','Over 2 years')]].map(([v,t])=>`<option value="${v}" ${draft.experienceYears===v?'selected':''}>${t}</option>`).join('')}</select></div></div>${draft.experience==='cert'?`<div class="fields2"><div class="field"><label>${L('Chứng chỉ đã có (tự khai)','Certificate attained (self-reported)')}</label><select onchange="draft.credential=this.value">${['none','N5','N4','N3','N2','N1','other'].map(v=>`<option value="${v}" ${draft.credential===v?'selected':''}>${v==='none'?L('Chọn chứng chỉ','Select certificate'):v==='other'?L('Chứng chỉ khác','Other qualification'):v}</option>`).join('')}</select></div><div class="field"><label>${L('Năm thi (không bắt buộc)','Exam year (optional)')}</label><input type="number" min="1990" max="2100" value="${escapeHtml(draft.certYear||'')}" oninput="draft.certYear=this.value" placeholder="2026"></div></div><div class="field"><label>${L('Điểm/chú thích khác (tùy chọn)','Score / additional note (optional)')}</label><input value="${escapeHtml(draft.certScore||'')}" oninput="draft.certScore=this.value" placeholder="${L('Không nhập thông tin nhạy cảm','No sensitive information')}"></div>`:''}`}
function changeExperience(v){draft.experience=v;renderSetup()};function toggleWeak(v,on){draft.weak=on?[...new Set([...draft.weak,v])]:draft.weak.filter(x=>x!==v)};

function nextSetup(){if(setupStep===0){if(!String(draft.label).trim()){toast(L('Nhập tên hồ sơ.','Enter a profile name.'));return}if(!draft.learningName.trim())draft.learningName=draft.label; if(!draft.kanaName.trim())draft.kanaName=autoReading(draft.learningName,draft.kanaMode).kana;}if(setupStep<2){setupStep++;renderSetup();window.scrollTo(0,0);return}let old=byId(active);profiles[active]={...old,...draft,label:draft.label.trim(),configured:true};persist();context={place:'home',minutes:Math.min(30,Number(draft.minutes)||15)};renderContext();showScreen('context')}
function renderContext(){$('ctxTag').textContent=L('CHỌN PHIÊN HỌC','CHOOSE STUDY SESSION');$('ctxTitle').textContent=L('Hôm nay bạn đang học ở đâu?','Where are you studying today?');$('ctxDesc').textContent=L('Một chạm để lựa chọn dạng bài phù hợp. Bạn có thể đổi bất kỳ lúc nào.','One tap tailors the lesson format. You can switch any time.');let phone=window.innerWidth<700;$('deviceLabel').textContent=L('Thiết bị gợi ý','Detected layout');$('deviceName').textContent=phone?L('Điện thoại / màn hình nhỏ','Phone / small display'):L('Máy tính / tablet','Desktop / tablet');$('deviceIcon').textContent=phone?'📱':'💻';$('contextHint').textContent=L('Đây chỉ là gợi ý theo màn hình; chế độ học do bạn quyết định.','This is a screen-size suggestion; you choose the actual learning mode.');const options=[['bus','🚌',L('Xe bus','Bus')],['train','🚆',L('Tàu','Train')],['desk','💻',L('Bàn học','Desk')],['class','🏫',L('Lớp học','Classroom')]];$('placeOptions').innerHTML=options.map(([k,ic,label])=>`<button class="option ${context.place===k?'selected':''}" onclick="context.place='${k}';renderContext()"><b>${ic}</b>${label}</button>`).join('');$('durationLabel').textContent=L('Thời gian hiện có','Time available');$('durationSegments').innerHTML=[5,15,30,60].map(n=>`<button class="${context.minutes===n?'selected':''}" onclick="context.minutes=${n};renderContext()">${n}m</button>`).join('');$('ctxSkip').textContent=L('Xem lộ trình','View my path');$('ctxStart').textContent=L('Tạo buổi học →','Plan my session →')}

const QUOTES=[{jp:'少しずつ、前へ。',r:'Sukoshi zutsu, mae e.',vi:'Từng chút một, tiến về phía trước.',en:'Little by little, move forward.',vvi:'少しずつ = từng chút một · 前 = phía trước',ven:'少しずつ = little by little · 前 = ahead',min:1},{jp:'今日も一歩ずつ。',r:'Kyō mo ippo zutsu.',vi:'Hôm nay cũng từng bước tiến lên.',en:'Another step forward today.',vvi:'今日 = hôm nay · 一歩 = một bước',ven:'今日 = today · 一歩 = one step',min:1},{jp:'失敗から学びます。',r:'Shippai kara manabimasu.',vi:'Học hỏi từ những sai lầm.',en:'Learn from mistakes.',vvi:'失敗 = thất bại · 学ぶ = học hỏi',ven:'失敗 = failure · 学ぶ = to learn',min:3},{jp:'自分のペースで進みましょう。',r:'Jibun no pēsu de susumimashō.',vi:'Hãy tiến lên theo nhịp độ của chính mình.',en:'Move forward at your own pace.',vvi:'自分 = bản thân · 進む = tiến lên',ven:'自分 = oneself · 進む = move forward',min:4}];function quoteFor(p){let rank=['Foundation','N5','N4','N3','N2','N1'].indexOf(p.goal);let allowed=QUOTES.filter(q=>rank>=q.min);if(!allowed.length)allowed=QUOTES.slice(0,2);let date=now(),dy=Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate())-new Date(date.getFullYear(),0,1))/86400000);return allowed[dy%allowed.length]}

}</button></div></div>`}

let practiceCursor=0;function renderPractice(){const p=byId(active),quick=context.place==='bus'||context.place==='train';let intro=L('Bài luyện thích ứng: nhớ chủ động, gợi ý từng mức và không bắt buộc gõ.','Adaptive practice: active recall, graduated hints and no required typing.');$('practice').innerHTML=`<div class="headrow"><div><div class="eyebrow">${L('LUYỆN TẬP THÔNG MINH','SMART PRACTICE')} · ${quick?L('TRÊN ĐƯỜNG','ON THE GO'):L('HỌC ĐẦY ĐỦ','FULL STUDY')}</div><h1>${L('Luyện theo ngữ cảnh','Context-aware Practice')}</h1><p>${intro}</p></div><span class="pill gold">${escapeHtml(p.goal)}</span></div><div class="card"><div class="row space"><h2>${L('Minna · Bài 1: thử nghiệm','Minna · Lesson 1: demo')}</h2><span class="pill">${practiceCursor+1}/${LESSON_QUESTIONS.length}</span></div><p class="subdued">${L('Dữ liệu bài tập mẫu chưa phải ngân hàng N2–N1.','This is a sample practice set, not an N2–N1 question bank.')}</p><div id="questionContainer"></div></div>${!quick?`<div class="card" style="margin-top:15px"><h2>${L('Nhiệm vụ dành cho buổi học đầy đủ','Recommended desk follow-up')}</h2><p>${L('Sau bài chọn đáp án, hãy viết lại 3 câu của chính bạn và đọc thành tiếng. Ghi chú bằng Sổ học; đây là phần chưa có đánh giá tự động.','After the tap quiz, write three original sentences and read aloud. Save notes in the notebook; this is not automatically scored yet.')}</p><button class="btn ghost" onclick="goWorkspace('journal')">${L('Mở Sổ học →','Open Study Notebook →')}</button></div>`:''}`;drawPracticeQuestion()}
function drawPracticeQuestion(){let q=LESSON_QUESTIONS[practiceCursor%LESSON_QUESTIONS.length];if(!practiceState||practiceState.id!==q.id)practiceState={id:q.id,hints:0,answered:false,choice:null,started:Date.now()};let st=practiceState;const hintTxt=lang==='vi'?q.hintsVi:q.hintsEn;let response=st.answered?`<div class="helpbox" style="margin-top:13px">${st.choice===q.answer?'✓ '+L('Đúng rồi.','Correct.'):L('Chưa đúng.','Not quite.')} ${escapeHtml(lang==='vi'?q.meaningVi:q.meaningEn)}<div class="fieldhint">${L('Đáp án','Answer')}: ${escapeHtml(q.opts[q.answer])} · ${escapeHtml(q.rom)}</div></div>`:'';$('questionContainer').innerHTML=`<div class="row space"><span class="pill">${escapeHtml(q.type.toUpperCase())}</span><span class="caption">${L('Gợi ý','Hints')}: ${st.hints}/3</span></div><div class="question" style="margin-top:12px"><div class="bigjp" style="font-size:clamp(26px,4vw,38px)">${escapeHtml(q.jp)}</div><div class="subdued">${escapeHtml(lang==='vi'?q.vi:q.en)}</div></div><div class="answers">${q.opts.map((o,i)=>`<button ${st.answered?'disabled':''} class="${st.answered&&(i===q.answer?'correct':st.choice===i?'incorrect':'')}" onclick="answerPractice(${i})">${escapeHtml(o)}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="nextHint()" ${st.hints>=3||st.answered?'disabled':''}>💡 ${L('Gợi ý tiếp','Next hint')}</button><button class="btn secondary" onclick="nextPracticeQuestion()">${L('Câu tiếp →','Next item →')}</button><button class="btn ghost" onclick="addTask(${JSON.stringify(L('Ôn mẫu câu: ','Review pattern: ')+q.jp)},'practice')">☆ ${L('Lưu để ôn','Save for review')}</button></div>${st.hints?`<div class="helpbox" style="margin-top:10px"><b>${L('Gợi ý','Hint')} ${st.hints}:</b> ${escapeHtml(hintTxt[st.hints-1])}</div>`:''}${response}`}
function answerPractice(ch){let st=practiceState;if(st.answered)return;st.choice=ch;st.answered=true;let q=LESSON_QUESTIONS[practiceCursor%LESSON_QUESTIONS.length],seconds=Math.min(120,Math.round((Date.now()-st.started)/1000));let rec={id:q.id,at:now().toISOString(),correct:ch===q.answer,hints:st.hints,seconds};byId(active).tests.push(rec);addEvent('practice',seconds,{question:q.id,correct:rec.correct,hints:st.hints});drawPracticeQuestion()}

function renderExams(){let p=byId(active),groups=['N5','N4','N3','N2','N1'];$('exams').innerHTML=`<div class="headrow"><div><div class="eyebrow">${L('LUYỆN ĐỀ THI','EXAM STUDIO')}</div><h1>${L('Luyện đề N5 → N1','Exam Practice N5 → N1')}</h1><p>${L('Chọn cấp bất kỳ. Mẫu tự biên chỉ kiểm tra giao diện; bạn có thể nhập đề JSON về sau.','Choose any level. Original demo sets test the interface; import your own structured JSON later.')}</p></div><button class="btn ghost tiny" onclick="downloadExamTemplate()">↓ JSON Template</button></div><div class="card"><div class="tabset">${groups.map(l=>`<button class="${(window.examLevel||p.goal||'N5')===l?'selected':''}" onclick="window.examLevel='${l}';renderExams()">${l}</button>`).join('')}</div>${allExams().filter(e=>e.level===(window.examLevel||(['N5','N4','N3','N2','N1'].includes(p.goal)?p.goal:'N5'))).map(e=>`<div class="examrow"><div><h3>${escapeHtml(lang==='vi'?(e.titleVi||e.titleEN||e.titleEn||e.title):e.titleEn||e.titleVi||e.title)}</h3><small>${e.questions.length} ${L('câu','questions')} · ${escapeHtml(e.year||L('Chưa gắn năm thi','No exam year'))} · ${e.source==='ORIGINAL DEMO'?L('Đề mô phỏng tự biên','Original demo'):L('Đề học viên nhập','Learner-imported')}</small><div class="flag">${e.source==='ORIGINAL DEMO'?L('ĐỀ MẪU TỰ BIÊN · KHÔNG PHẢI ĐỀ THI CHÍNH THỨC','ORIGINAL DEMO · NOT AN OFFICIAL TEST'):L('BỘ ĐỀ NHẬP TỪ FILE','IMPORTED QUESTION SET')}</div></div><button class="btn tiny primary" onclick="startExam('${escapeHtml(e.id)}')">${L('Làm đề','Start')}</button></div>`).join('')||`<p>${L('Chưa có đề ở cấp này.','No paper for this level yet.')}</p>`}<div class="helpbox" style="margin-top:18px">${L('Để nhập đề từ PDF/ảnh trong tương lai, cần bước trích xuất và người dùng duyệt lại đáp án. Bản này chỉ nhập JSON có cấu trúc, chưa xử lý PDF.','PDF/image ingestion will require extraction and human answer-key review. This preview imports structured JSON only.')}</div><div class="actions"><button class="btn secondary" onclick="$('importExam').click()">＋ ${L('Nhập đề JSON','Import JSON exam')}</button><input class="hidden" type="file" accept=".json,application/json" id="importExam" onchange="importExamFile(event)"></div></div>`}
function downloadExamTemplate(){const obj={schema:'nihongo-path-exam-v1',id:'USER-TEST-001',level:'N5',year:null,source:'USER IMPORT',titleVi:'Đề tự tạo',titleEn:'User-created practice',questions:[{jp:'わたし___ がくせいです。',vi:'Chọn trợ từ đúng',en:'Choose the correct particle',options:['は','の','か','も'],answer:0,romaji:'Watashi wa gakusei desu.'}]};downloadFile('Nihongo_Path_Exam_Template.json',JSON.stringify(obj,null,2),'application/json')}
async function importExamFile(ev){let f=ev.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.schema!=='nihongo-path-exam-v1'||!['N5','N4','N3','N2','N1'].includes(x.level)||!Array.isArray(x.questions)||x.questions.length<1||x.questions.length>150)throw Error('schema');for(let q of x.questions){if(!Array.isArray(q.options)||q.options.length<2||q.options.length>6||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)throw Error('answer key')}x.id='USER-'+Date.now();x.source='USER IMPORT';byId(active).imported.push(x);persist();toast(L('Đã nhập bộ đề JSON.','JSON question set imported.'));window.examLevel=x.level;renderExams()}catch(e){toast(L('File không hợp lệ. Hãy dùng file mẫu JSON.','Invalid file. Use the JSON template.'))}finally{ev.target.value=''}}
function startExam(id){let x=allExams().find(e=>e.id===id);if(!x)return;examState={id,at:0,questions:shuffle(x.questions),results:[],started:Date.now()};showExamQuestion()}
function showExamQuestion(){if(!examState||examState.at>=examState.questions.length){finishExam();return}let q=examState.questions[examState.at];$('exams').innerHTML=`<div class="card" style="max-width:760px;margin:auto"><div class="row space"><span class="eyebrow">${L('LUYỆN ĐỀ THI','EXAM PRACTICE')} · ${examState.id}</span><span class="pill gold">${examState.at+1}/${examState.questions.length}</span></div><div class="question"><div class="bigjp" style="font-size:clamp(21px,4vw,34px)">${escapeHtml(q.jp)}</div><p>${escapeHtml(lang==='vi'?q.vi||'':q.en||'')}</p></div><div class="answers">${q.options.map((o,i)=>`<button onclick="answerExam(${i})">${escapeHtml(o)}</button>`).join('')}</div><p class="subdued small">${L('Kiểm tra độc lập không có gợi ý.','Independent assessment has no hints.')}</p></div>`;examState.questionStart=Date.now()}
function answerExam(i){let q=examState.questions[examState.at];examState.results.push({correct:i===q.answer,choice:i,answer:q.answer,seconds:Math.round((Date.now()-examState.questionStart)/1000)});examState.at++;showExamQuestion()}
function finishExam(){let p=byId(active),n=examState.results.length,c=examState.results.filter(x=>x.correct).length,score=Math.round(c/n*100);p.exams.push({at:now().toISOString(),id:examState.id,score,total:n,correct:c});addEvent('exam',Math.round((Date.now()-examState.started)/1000),{score,id:examState.id});$('exams').innerHTML=`<div class="card"><div class="eyebrow">${L('KẾT QUẢ BÀI THI','EXAM RESULT')}</div><h1>${L('Hoàn thành bộ đề','Exam completed')}</h1><div class="grid3"><div class="metric"><strong>${c}/${n}</strong><small>${L('Số câu đúng','Correct answers')}</small></div><div class="metric"><strong>${score}%</strong><small>${L('Tỷ lệ chính xác','Accuracy')}</small></div><div class="metric"><strong>${examState.results.reduce((n,x)=>n+x.seconds,0)}s</strong><small>${L('Thời gian trả lời','Answering time')}</small></div></div><div class="actions"><button class="btn primary" onclick="renderExams()">${L('Về thư viện đề','Return to exam library')}</button><button class="btn ghost" onclick="goWorkspace('journal')">${L('Xem thống kê','View analytics')}</button></div></div>`;examState=null}

function castDetail(id){let c=CAST.find(c=>c.id===id);if(!c)return;const H=escapeHtml;let history=Array.isArray(c.history)?c.history.map(row=>`<div class="planitem"><span class="stateicon">${H(row[0])}</span><div class="desc"><strong>${H(lang==='vi'?row[1]:row[2]||row[1])}</strong></div></div>`).join(''):'';openDialog(H(c.jp)+' · '+H(c.roman),`<p><b>${L('Nghề nghiệp','Profession')}:</b> ${H(lang==='vi'?c.jobVI:c.jobEN)}</p><p><b>${L('Quốc gia','Country')}:</b> ${H(lang==='vi'?c.countryVI||c.country:c.countryEN||c.country)}</p><p><b>${L('Sở thích','Hobbies')}:</b> ${H(lang==='vi'?c.hobbyVI||c.hobby:c.hobbyEN||c.hobby)}</p><p><b>${L('Quan hệ','Relationships')}:</b> ${H(lang==='vi'?c.linksVI||'':c.linksEN||'')}</p><h3>${L('Lịch sử công việc','Career timeline')}</h3>${history}<div class="helpbox">${L('Hồ sơ hư cấu; chi tiết các cảnh trong tương lai cần kiểm duyệt trước khi dùng trong bài học.','Fictional character profile; future dialogue content requires review before release.')}</div>`)}
function renderJournal(){let p=byId(active);let opts=[['today',L('Hôm nay','Today')],['calendar',L('Lịch nhiều năm','Calendar')],['analytics',L('Thống kê','Analytics')],['tasks',L('Sổ bài tập','Notebook')]];$('journal').innerHTML=`<div class="headrow"><div><div class="eyebrow">${L('SỔ HỌC VÀ THỐNG KÊ','STUDY JOURNAL & INSIGHTS')}</div><h1>${L('Sổ hành trình và thống kê','Study Journal & Analytics')}</h1><p>${L('Theo dõi theo ngày, tháng, năm; dữ liệu riêng từng hồ sơ.','Review progress by day, month and year, separately for each profile.')}</p></div><button class="btn ghost tiny" onclick="goWorkspace('settings')">${L('Sao lưu','Backup')} →</button></div><div class="tabset">${opts.map(([k,t])=>`<button class="${journalTab===k?'selected':''}" onclick="journalTab='${k}';renderJournal()">${t}</button>`).join('')}</div><div id="journalPane"></div>`;if(journalTab==='today')drawToday();if(journalTab==='calendar')drawCalendar();if(journalTab==='analytics')drawAnalytics();if(journalTab==='tasks')drawTasks()}
function drawToday(){let p=byId(active),e=oneToday(),sum=Math.floor(((p.activeByDay||{})[isoDay()]||0)/60),recs=profileRecommendations();$('journalPane').innerHTML=`<div class="grid3"><button class="metric" onclick="openMetric('active')"><strong>${sum}m</strong><small>${L('Thời gian tương tác tích lũy','Accumulated active time')}</small></button><button class="metric" onclick="openMetric('sessions')"><strong>${e.filter(x=>x.type==='login').length}</strong><small>${L('Phiên đăng nhập hôm nay','Logins today')}</small></button><button class="metric" onclick="openMetric('test')"><strong>${e.filter(x=>x.type==='exam'||x.type==='kana-test').length}</strong><small>${L('Bài kiểm tra hôm nay','Tests today')}</small></button></div>${p.current?.type==='kana'?`<div class="card" style="margin-top:14px"><h2>${L('Bài đang làm dở','Unfinished assessment')}</h2><p>${L('Kana · Câu','Kana · Question')} ${(p.current.test.at||0)+1}/${p.current.test.questions.length}</p><button class="btn primary" onclick="resumeKana();goWorkspace('path');renderKanaQuestion()">${L('Học tiếp →','Resume →')}</button></div>`:''}<div class="card" style="margin-top:15px"><div class="row space"><h2>${L('Nhiệm vụ nên lưu hôm nay','Suggested tasks for today')}</h2><span class="pill gold">${recs.length}</span></div>${recs.map(r=>`<div class="planitem"><div class="desc"><strong>${escapeHtml(r.name)}</strong><small>${escapeHtml(r.desc)}</small></div><button class="btn tiny ghost" onclick="addTask(${JSON.stringify(r.name)})">＋</button></div>`).join('')}</div><div class="card" style="margin-top:15px"><h2>${L('Nhật ký hoạt động','Recent activity')}</h2>${e.length?e.slice(-15).reverse().map(x=>`<div class="planitem"><div class="desc"><strong>${escapeHtml(eventText(x.type))}</strong><small>${new Date(x.at).toLocaleTimeString(lang==='vi'?'vi-VN':'en-US',{hour:'2-digit',minute:'2-digit'})}${x.seconds?' · '+x.seconds+'s':''}</small></div></div>`).join(''):`<p>${L('Chưa có hoạt động được ghi trong ngày.','No tracked activities today.')}</p>`}</div>`}
function eventText(t){return ({login:L('Bắt đầu phiên học','Session started'),practice:L('Luyện câu','Practice item'),exam:L('Hoàn thành bài thi','Exam completed'),'kana-test':L('Kiểm tra Kana','Kana assessment'),pause:L('Tạm dừng','Paused'), 'task-add':L('Lưu nhiệm vụ','Task saved'), 'level-change':L('Đổi cấp học','Level changed')})[t]||t}
let monthOffset=0,calendarMode='month';function drawCalendar(){const p=byId(active),d=now(),base=new Date(d.getFullYear(),d.getMonth()+monthOffset,1),y=base.getFullYear(),m=base.getMonth(),days=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7,logged={};for(let e of p.events||[]){let k=isoDay(new Date(e.at));logged[k]=(logged[k]||0)+1}let weeks=[...Array(first)].map(()=>'<div></div>');for(let n=1;n<=days;n++){let k=isoDay(new Date(y,m,n));let num=logged[k]||0;weeks.push(`<button style="min-height:50px;border:1px solid ${k===isoDay()?'#edce93':'#35496e'};background:${num?'#31516b':'#172742'};color:#fff;border-radius:10px" onclick="showDay('${k}')">${n}${num?'<small style="display:block;color:#efd49e">'+num+' ●</small>':''}</button>`)}let months=[];for(let yy=y-1;yy<=y+1;yy++){months.push(`<button class="btn tiny ghost" onclick="monthOffset+=${(yy-y)*12};drawCalendar()">${yy}</button>`)}$('journalPane').innerHTML=`<div class="card"><div class="row space mobilewrap"><h2>${base.toLocaleDateString(lang==='vi'?'vi-VN':'en-US',{month:'long',year:'numeric'})}</h2><div class="actions" style="margin:0"><button class="btn tiny ghost" onclick="monthOffset-=12;drawCalendar()">«</button><button class="btn tiny ghost" onclick="monthOffset--;drawCalendar()">◀</button><button class="btn tiny secondary" onclick="monthOffset=0;drawCalendar()">${L('Hôm nay','Today')}</button><button class="btn tiny ghost" onclick="monthOffset++;drawCalendar()">▶</button><button class="btn tiny ghost" onclick="monthOffset+=12;drawCalendar()">»</button></div></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center">${[L('T2','Mon'),L('T3','Tue'),L('T4','Wed'),L('T5','Thu'),L('T6','Fri'),L('T7','Sat'),L('CN','Sun')].map(s=>`<small style="padding:10px 0">${s}</small>`).join('')}${weeks.join('')}</div><p class="caption" style="margin-top:14px">${L('Ngày hiện tại được đánh dấu màu vàng. Bạn có thể chuyển tháng hoặc xem nhiều năm trong Analytics.','Today has a gold outline. Navigate months, and review yearly trends in Analytics.')}</p></div>`}
function showDay(k){let p=byId(active),x=p.events.filter(e=>isoDay(new Date(e.at))===k);openDialog(k,`<p>${x.length} ${L('sự kiện học tập','learning events')}</p>${x.map(e=>`<div class="planitem"><div class="desc"><strong>${eventText(e.type)}</strong><small>${new Date(e.at).toLocaleTimeString(lang==='vi'?'vi-VN':'en-US')}</small></div></div>`).join('')||L('Chưa có dữ liệu.','No data.')}`)}
function drawAnalytics(){let p=byId(active),m=(p.kanaResults||[]).length,ex=(p.exams||[]).length,tests=(p.tests||[]).length,correct=p.tests.filter(x=>x.correct).length,dayBuckets=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=isoDay(d);let events=p.events.filter(x=>isoDay(new Date(x.at))===k);dayBuckets.push({day:d.toLocaleDateString(lang==='vi'?'vi-VN':'en-US',{weekday:'short'}),count:events.filter(x=>['kana-test','practice','exam'].includes(x.type)).length})}let max=Math.max(1,...dayBuckets.map(x=>x.count));$('journalPane').innerHTML=`<div class="grid4"><button class="metric" onclick="openMetric('active')"><strong>${Math.floor((p.activeSeconds||0)/60)}m</strong><small>${L('Tương tác thực','Active study time')}</small></button><button class="metric" onclick="openMetric('sessions')"><strong>${p.events.filter(x=>x.type==='login').length}</strong><small>${L('Số phiên học','Study sessions')}</small></button><button class="metric" onclick="openMetric('test')"><strong>${m+ex}</strong><small>${L('Kana & bài thi','Kana and exams')}</small></button><button class="metric" onclick="openMetric('accuracy')"><strong>${tests?Math.round(correct/tests*100)+'%':'—'}</strong><small>${L('Luyện đúng lần đầu','First-attempt accuracy')}</small></button></div><div class="card" style="margin-top:14px"><h2>${L('Hoạt động 7 ngày qua','Activity over 7 days')}</h2><p class="small">${L('Số hoạt động luyện/kiểm tra, không phải thời lượng ngồi trước màn hình.','Number of practice and test events, not time spent with the app open.')}</p><div class="fauxgraph">${dayBuckets.map(x=>`<div class="bar" style="height:${Math.max(8,80*x.count/max)}px" title="${x.count}"><small>${x.day}</small></div>`).join('')}</div><div class="actions" style="margin-top:36px"><button class="btn ghost" onclick="openMetric('years')">${L('Chi tiết theo năm','Yearly breakdown')} →</button><button class="btn ghost" onclick="openMetric('test')">${L('Lịch sử điểm','Score history')} →</button></div></div>`}
function openMetric(kind){let p=byId(active);let data='';if(kind==='active')data=`<p>${L('Thời gian tương tác được tính khi ứng dụng hiện trên màn hình và có thao tác trong vòng 60 giây. Đây là ước tính, không phải thời gian học đã được kiểm chứng.','Active time counts while the app is visible and interactions occurred within 60 seconds. This is an estimate, not verified study time.')}</p><strong>${Math.floor((p.activeSeconds||0)/60)} ${L('phút','minutes')}</strong>`;

art Review','05 · Smart Review'),tr('Câu sai, câu dùng gợi ý và câu đã lưu.','Wrong, hinted and saved questions.')]].map(([k,t,d])=>`<button class="card v68link" onclick="v68go('${k}')"><h3>${t}</h3><p>${d}</p><span class="pill gold">${tr('Mở →','Open →')}</span></button>`).join('')}</div>`}

function v68checkBuilder(){let b=v68builderState(),q=v68builderQ();if(!b||!q||b.completed.length>b.at)return;let chosen=b.selected.map(id=>v68builderTokens().find(x=>x.id===id)?.word);let correct=chosen.join('|')===q.jp.filter(x=>!/[。、,.？！?]/.test(x)).join('|');b.completed.push({id:b.ids[b.at],correct,hints:b.hint,answer:chosen,at:new Date().toISOString()});if(!correct||b.hint>0){if(!get68().savedSentences)get68().savedSentences=[];if(!get68().savedSentences.includes(b.ids[b.at]))get68().savedSentences.push(b.ids[b.at])}persist();renderBuilder68()}
function v68nextBuilder(){let st=get68(),b=st.builder;if(!b||b.completed.length<=b.at)return;b.at++;b.selected=[];b.bank=null;b.hint=0;b.opened=Date.now();if(b.at>=b.ids.length){let correct=b.completed.filter(x=>x.correct).length,independent=b.completed.filter(x=>x.correct&&x.hints===0).length;st.builderHistory=st.builderHistory||[];st.builderHistory.push({at:new Date().toISOString(),correct,independent,total:b.ids.length,items:b.completed});st.builder=null;st.tab='builder-result';addEvent('builder',0,{correct,total:12});persist();renderBuilder68();return}persist();renderBuilder68()}
function v68saveBuilder(){let st=get68(),b=st.builder;if(!b)return;st.savedSentences=st.savedSentences||[];let id=b.ids[b.at];if(!st.savedSentences.includes(id))st.savedSentences.push(id);persist();toast(tr('✓ Đã lưu tại Bài 1 → Ôn đã lưu.','✓ Saved in Lesson 1 → Saved Review.'));renderBuilder68()}
function renderBuilder68(){let st=get68(),b=st.builder;if(!b){let r=(st.builderHistory||[]).at(-1);$('practice').innerHTML=v68builderShell(`<div class="card"><h2>${r?tr('Hoàn thành 12 câu ghép!','12 sentence builds completed!'):tr('Ghép câu theo tình huống','Build sentences in context')}</h2>${r?`<div class="grid3"><div class="metric"><strong>${r.correct}/12</strong><small>${tr('Đúng','Correct')}</small></div><div class="metric"><strong>${r.independent}/12</strong><small>${tr('Không gợi ý','Without hints')}</small></div><div class="metric"><strong>${(st.savedSentences||[]).length}</strong><small>${tr('Cần ôn','To review')}</small></div></div>`:''}<p>${tr('Một lượt gồm 12 câu ngẫu nhiên lấy từ 24 tình huống tự biên, mỗi câu kết thúc rõ ràng.','Each round includes 12 randomized items from 24 original practice situations, with a definite end.')}</p><div class="actions"><button class="btn primary" onclick="v68startBuilder()">${tr('Bắt đầu 12 câu mới','Start 12 new items')}</button><button class="btn ghost" onclick="v68go('review')">${tr('Ôn đã lưu →','Saved Review →')}</button></div></div>`);return}
 const q=v68builderQ(),bank=v68builderTokens(),done=b.completed.length>b.at,record=done?b.completed[b.at]:null,goal=q.jp.filter(x=>!/[。、,.？！?]/.test(x));let selected=new Set(b.selected);
 let hint=b.hint?`<div class="helpbox"><b>💡 ${tr('Gợi ý','Hint')} ${b.hint}/3</b><p>${b.hint===1?tr('Xác định chủ ngữ, trợ từ và từ kết thúc câu.','Find the topic, particle and polite ending.'):b.hint===2?`${tr('Từ đầu tiên cần là','The first tile should be')} <b>${esc68(goal[0])}</b>`:tr('Đã điền một từ đúng tiếp theo; hãy hoàn thành phần còn lại.','The next correct word was filled in; complete the rest.')}</p></div>`:'';
 let feedback=done?`<div class="helpbox v68feedback"><b>${record.correct?tr('✓ Đúng cấu trúc!','✓ Correct sentence!'):tr('Chưa đúng – xem lại mẫu câu.','Not quite – review the sentence pattern.')}</b><div class="v68japanese" style="font-size:22px">${esc68(q.jp.join(' '))}</div><p>${esc68(lang==='vi'?q.tip:V68_SENT_TIP_EN[b.ids[b.at]])}</p><p class="caption">${record.hints?tr('Có sử dụng gợi ý','Hints used'):tr('Tự làm không gợi ý','Independent attempt')}</p></div>`:'';
 let content=`<div class="card"><div class="row space"><div><div class="eyebrow">SENTENCE BUILDER · ${b.at+1}/${b.ids.length}</div><h2>${tr('Xếp câu tiếng Nhật','Build the Japanese sentence')}</h2></div><span class="pill">${b.completed.length}/${b.ids.length}</span></div><div class="progress"><div style="width:${b.completed.length/b.ids.length*100}%"></div></div><div class="question">${esc68(lang==='vi'?q.vi:V68_SENT_EN[b.ids[b.at]])}</div><div class="v68sentenceanswer">${b.selected.map(id=>{let t=bank.find(x=>x.id===id);return `<button class="choice chosen" onclick="v68unpickBuilder('${t.id}')" ${done?'disabled':''}>${esc68(t.word)}</button>`}).join('')||`<span class="subdued">${tr('Chạm chọn các từ bên dưới theo thứ tự','Tap words below in the correct order')}</span>`}</div><div class="v68sentencebank">${bank.filter(x=>!selected.has(x.id)).map(t=>`<button class="choice" onclick="v68pickBuilder('${t.id}')" ${done?'disabled':''}>${esc68(t.word)}</button>`).join('')}</div>${hint}${feedback}<div class="actions">${done?`<button class="btn primary" onclick="v68nextBuilder()">${b.at===11?tr('Xem kết quả cuối lượt ✦','See final results ✦'):tr('Câu tiếp →','Next item →')}</button>`:`<button class="btn secondary" onclick="v68builderHint()" ${b.hint===3?'disabled':''}>💡 ${tr('Gợi ý tiếp','Next hint')} (${b.hint}/3)</button><button class="btn primary" onclick="v68checkBuilder()">${tr('Kiểm tra câu','Check answer')}</button>`}<button class="btn ghost" onclick="v68saveBuilder()">☆ ${tr('Lưu để ôn','Save for review')}</button><button class="btn ghost" onclick="v68go('overview')">${tr('Tạm dừng','Pause')}</button></div></div>`;
 $('practice').innerHTML=v68builderShell(content)
}

const _continue68=v68continue;v68continue=function(){if(get68().builder){get68().tab='builder';goWorkspace('practice');return}_continue68()};
const _review68=v68review;v68review=function(st){const saved=(st.savedSentences||[]).map(i=>({q:V68_SENTENCES[i],id:i}));let html=_review68(st);if(saved.length){let extra=`<div class="v68reviewitem"><h3>${tr('Ghép câu đã lưu','Saved sentence builds')} (${saved.length})</h3>${saved.map(x=>`<div class="rule"><p>${esc68(lang==='vi'?x.q.vi:V68_SENT_EN[x.id])}</p><b>${esc68(x.q.jp.join(' '))}</b><p>${esc68(lang==='vi'?x.q.tip:V68_SENT_TIP_EN[x.id])}</p></div>`).join('')}</div>`;html=html.replace('</div><button class="btn primary"',`${extra}</div><button class="btn primary"`)}return html};
